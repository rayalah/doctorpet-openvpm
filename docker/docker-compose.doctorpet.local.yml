services:
  postgres:
    environment:
      POSTGRES_DB: doctorpet_dev
      POSTGRES_USER: ${DOCTORPET_POSTGRES_USER:?set DOCTORPET_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${DOCTORPET_POSTGRES_PASSWORD:?set DOCTORPET_POSTGRES_PASSWORD in .env}
    ports: !override
      - "55432:5432"
    volumes:
      - doctorpet_postgres_data:/var/lib/postgresql/data

  minio:
    environment:
      MINIO_ROOT_USER: ${DOCTORPET_MINIO_ROOT_USER:?set DOCTORPET_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${DOCTORPET_MINIO_ROOT_PASSWORD:?set DOCTORPET_MINIO_ROOT_PASSWORD in .env}
    ports: !override
      - "59000:9000"
      - "59001:9001"
    volumes:
      - doctorpet_minio_data:/data

  minio-bootstrap:
    environment:
      MINIO_ROOT_USER: ${DOCTORPET_MINIO_ROOT_USER:?set DOCTORPET_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${DOCTORPET_MINIO_ROOT_PASSWORD:?set DOCTORPET_MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_BUCKET"

  web:
    environment:
      DATABASE_URL: postgresql://${DOCTORPET_POSTGRES_USER:?set DOCTORPET_POSTGRES_USER in .env}:${DOCTORPET_POSTGRES_PASSWORD:?set DOCTORPET_POSTGRES_PASSWORD in .env}@postgres:5432/doctorpet_dev
      FILE_STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${DOCTORPET_MINIO_ROOT_USER:?set DOCTORPET_MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${DOCTORPET_MINIO_ROOT_PASSWORD:?set DOCTORPET_MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-us-east-1}

volumes:
  doctorpet_postgres_data:
  doctorpet_minio_data:
